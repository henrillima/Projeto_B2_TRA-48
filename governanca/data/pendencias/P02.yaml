    texto: "Base publicada no Classroom em 28/10: data_project.Rda com data_train (6.426 voos) e data_test (1.607), 14 colunas, SBGR em janeiro de 2026. Variaveis descritas no apendice do enunciado. Arquivada em ITA/08-semestre/TRA-48/projetos/b2-data-challenge/."
