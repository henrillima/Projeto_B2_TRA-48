id: pendencia:P02
kind: pendencia
titulo: "O esquema da base do Data Challenge é desconhecido até 28/10"
status: fechada
criado_em: 2026-10-06
descricao: |
  Não se sabe quais colunas a base de treino terá, qual a granularidade (voo a voo?
  agregada por janela?), qual o período coberto, nem se traz meteorologia, pista em uso ou
  contagem de aeronaves no pátio. Toda a construção de features depende disso. Enquanto
  estiver aberta, as features existem apenas como hipótese documentada e como colunas da
  base sintética de brinquedo.
